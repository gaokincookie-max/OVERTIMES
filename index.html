<!doctype html><html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>残業 / デスク操作試作</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/under-desk.css">
<link rel="stylesheet" href="css/pc.css">
<link rel="stylesheet" href="css/camera-and-failure.css">
</head>
<body>
<div id="app">
<header>
<b>OVERTIME / DESK + CCTV v0.11</b>
<button id="camera">上・監視</button>
<button id="pc">中央・PC</button>
<button id="left">左・飲食</button>
<button id="right">右・書類</button>
<button id="under">下・机の下</button>
<span id="stats">
</span>
</header>
<main>
<div class="stage" id="stage">
<img class="bg" id="bg" alt="机の背景">
<div id="items">
</div>
<div id="pcLayer" hidden>
<button id="screenTap" aria-label="PC業務画面を開く">
<span>社内業務管理システム</span>
<small id="screenStatus">
</small>
<span class="screenHint">タップして業務画面を開く</span>
</button>
<button id="monitorKey" aria-label="モニターの電源">
<img alt="" id="powerImg">
</button>
<button id="remoteKey" aria-label="照明リモコン">
<img alt="" id="remoteImg">
</button>
</div>
<div id="pcZoom" hidden>
<div class="pcbar">
<b>社内業務管理システム</b>
<button id="pcBack">縮小 ×</button>
</div>
<div class="pcwork"><p>本日の未処理業務（仮）</p>
<div id="pcRows">
</div><p id="pcStatus"></p>
</div>
<div class="pcbar">
<button id="pcSave">保存</button>
</div>
</div>
<div id="remoteUI" class="veil" hidden>
<div class="remotePanel">
<div class="bar">
<b>照明リモコン</b>
<button id="remoteClose">×</button>
</div>
<div class="remoteBody"><p id="remoteState"></p>
<button id="remoteOn">ON　点灯</button>
<button id="remoteOff">OFF　消灯</button>
</div>
</div>
</div>
<button id="underAction" hidden>潜る</button>
<div class="blink" id="blink">
</div>
<div class="hud" id="hud">
</div>
<div class="toast" id="toast" aria-live="polite">
</div>
</div>
<div class="veil" id="veil" hidden>
<div class="panel">
<div class="bar">
<b id="jobtitle">
</b>
<button id="close">×</button>
</div>
<div class="content" id="content">
</div>
</div>
</div>
<div id="cameraPane" hidden>
<iframe id="cameraFrame" title="監視カメラ">
</iframe>
<button id="cameraBack">↑ PCへ戻る</button>
</div>
<div id="failure" hidden style="position:absolute;inset:0;z-index:30;background:#08090bf5;display:grid;place-content:center;text-align:center;gap:14px">
<b style="font-size:28px;color:#ae6565">GAME OVER</b>
<span id="failureReason">
</span>
<button id="retry">リセットして再試行</button>
</div>
</main>
<footer>
<button id="light">消灯</button>
<button id="labels">ラベル表示</button>
<button id="reset">リセット</button>
<div id="underTools" hidden>
<select id="eventKind"><option value="patrol">巡回社員</option><option value="light">光反応型</option>
</select>
<button id="testEvent">接近テスト</button>
<button id="clearEvent">怪異解除</button>
</div>
<span>フリックで視点移動</span>
</footer>
</div>
<script src="js/assets.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/desk.js"></script>
<script src="js/food.js"></script>
<script src="js/paperwork.js"></script>
<script src="js/navigation.js"></script>
<script src="js/under-desk.js"></script>
<script src="js/pc.js"></script>
<script src="js/encounters.js"></script>
<script src="js/camera-bridge.js"></script>
<script src="js/main.js"></script>
</body>
</html>
